<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Certificate Design — SkillProof</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><header class="topbar"><div class="wrap"><div class="brand"><span class="logo">S</span> SkillProof <small>ACADEMY</small></div><div class="navlinks"><button class="btn btn-ghost btn-sm" onclick="SP.logout('../index.html')">Logout</button></div></div></header><div class="wrap page"><div class="acad-layout"><nav class="acad-nav"><a href="dashboard.html">📊 Dashboard</a><a href="profile.html">🏫 Academy Profile</a><a href="certificate-design.html" class="active">🎨 Certificate Design</a><a href="teachers.html">👨‍🏫 Teachers</a></nav><div><div class="panel" style="margin-bottom:20px"><h2>🎨 Certificate Design</h2><p class="lede">Apni academy ka certificate khud design karo — neeche live preview dekho!</p><div id="msg"></div><h3 class="section-title" style="margin-top:0">1️⃣ Rang (Color Theme)</h3><div class="theme-row" id="themes"></div><h3 class="section-title">2️⃣ Layout (Template)</h3><div class="tpl-row" id="templates"></div><h3 class="section-title">3️⃣ Dastakhat (Signatures)</h3><div class="grid2"><div class="field"><label>Director / Sign karne wale ka naam</label><input id="dname" placeholder="e.g. Sir Ahmed"></div><div class="field"><label>Ohda (Designation)</label><input id="dtitle" placeholder="e.g. Director"></div></div><div class="field"><label>Tagline</label><input id="tagline" placeholder="e.g. Pehle TEST, phir certificate."></div><div class="field"><label><input type="checkbox" id="showscore" style="width:auto;margin-right:8px">Certificate par score (%) dikhao</label></div><button class="btn btn-green btn-lg" onclick="save()">💾 Design Save Karo</button></div><h2 class="section-title">👁️ Live Preview</h2><div class="preview-frame"><div id="preview"></div></div></div></div></div><footer class="site"><div class="wrap">SkillProof © 2026</div></footer><script src="../assets/js/common.js"></script><script> SP.requireAuth('academy','../academy-login.html'); var design = SP.getCertDesign(); var profile = SP.getAcademyProfile(); var THEMES = [ {id:'gold', name:'Gold Classic', dot:'#b45309'}, {id:'blue', name:'Blue Modern', dot:'#1d4ed8'}, {id:'green', name:'Green Fresh', dot:'#1a9e54'}, {id:'maroon', name:'Maroon Royal', dot:'#7f1d1d'} ]; var TPLS = [ {id:'classic', name:'Classic'}, {id:'modern', name:'Modern'}, {id:'minimal', name:'Minimal'} ]; function renderPickers(){ document.getElementById('themes').innerHTML = THEMES.map(function(t){ return '<div class="theme-swatch'+(design.theme===t.id?' sel':'')+'" onclick="setTheme(\''+t.id+'\')">' + '<div class="dot" style="background:'+t.dot+'"></div>'+t.name+'</div>'; }).join(''); document.getElementById('templates').innerHTML = TPLS.map(function(t){ return '<div class="tpl-opt'+(design.template===t.id?' sel':'')+'" onclick="setTpl(\''+t.id+'\')">' + '<div class="mini">'+t.name+' layout</div><div class="tname">'+t.name+'</div></div>'; }).join(''); } function setTheme(id){ design.theme=id; renderPickers(); renderPreview(); } function setTpl(id){ design.template=id; renderPickers(); renderPreview(); } function readForm(){ design.directorName = document.getElementById('dname').value.trim(); design.directorTitle = document.getElementById('dtitle').value.trim() || 'Director'; design.tagline = document.getElementById('tagline').value.trim(); design.showScore = document.getElementById('showscore').checked; } function renderPreview(){ readForm(); var demoCert = {id:'SP-2026-12345', studentName:'Ahmed Raza', course:'MS Office Professional', score:85, date:SP.today(), academy:profile.name}; var fakeUrl = 'https://skillproof.app/verify.html?id=SP-2026-12345'; document.getElementById('preview').innerHTML = SP.certHTML(demoCert, design, profile, fakeUrl); } function save(){ readForm(); SP.saveCertDesign(design); document.getElementById('msg').innerHTML='<div class="alert alert-ok">✅ Design save ho gaya! Ab se naye certificates isi design mein banenge.</div>'; setTimeout(function(){ document.getElementById('msg').innerHTML=''; }, 3500); } document.getElementById('dname').value = design.directorName||''; document.getElementById('dtitle').value = design.directorTitle||'Director'; document.getElementById('tagline').value = design.tagline||''; document.getElementById('showscore').checked = design.showScore !== false; ['dname','dtitle','tagline','showscore'].forEach(function(id){ document.getElementById(id).addEventListener('input', renderPreview); document.getElementById(id).addEventListener('change', renderPreview); }); renderPickers(); renderPreview(); </script></body></html>
