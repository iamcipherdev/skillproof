<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Student Login — SkillProof</title><link rel="stylesheet" href="assets/css/style.css"></head><body><header class="topbar"><div class="wrap"><div class="brand"><span class="logo">S</span> SkillProof</div><div class="navlinks"><a href="index.html">← Home</a></div></div></header><div class="login-page"><div class="login-box"><div class="lic">🎓</div><h1>Student Login</h1><div class="lsub">Apna test do, certificate pao!</div><div id="err"></div><div class="field"><label>Student ID</label><input id="sid" placeholder="e.g. demo123" autocomplete="username"></div><div class="field"><label>Password</label><input id="spw" type="password" placeholder="••••••" autocomplete="current-password"></div><button class="btn btn-green btn-block btn-lg" onclick="go()">Login →</button><div class="demo-hint">🧪 Demo: ID <b>demo123</b> / Password <b>demo123</b></div><a class="back" href="index.html">← Wapas home</a></div></div><footer class="site"><div class="wrap">SkillProof © 2026</div></footer><script src="assets/js/common.js"></script><script> function go(){ document.getElementById('err').innerHTML = ''; var s = SP.loginStudent(document.getElementById('sid').value, document.getElementById('spw').value); if(s) location.href = 'student/dashboard.html'; else document.getElementById('err').innerHTML = '<div class="alert alert-err">❌ Ghalat ID ya password! Teacher se apni ID lo.</div>'; } document.getElementById('spw').addEventListener('keydown', function(e){ if(e.key==='Enter') go(); }); document.getElementById('sid').focus(); </script></body></html>
