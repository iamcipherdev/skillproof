<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificate — SkillProof</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<header class="topbar no-print">
  <div class="wrap">
    <div class="brand"><span class="logo">S</span> SkillProof</div>
    <div class="navlinks"><a href="dashboard.html">Dashboard</a> <button class="btn btn-ghost btn-sm" onclick="SP.logout('../student-login.html')">Logout</button></div>
  </div>
</header>

<div class="wrap page">
  <div id="out"></div>
  <div class="cert-actions no-print">
    <button class="btn btn-green btn-lg" onclick="window.print()">🖨️ Print / Save PDF</button>
    <a class="btn btn-ghost" href="dashboard.html">← Dashboard</a>
  </div>
</div>

<footer class="site no-print"><div class="wrap">SkillProof © 2026</div></footer>

<script src="../assets/js/common.js"></script>
<script src="../assets/js/questions.js"></script>
<script>
var me = SP.requireAuth('student','../student-login.html');
var params = new URLSearchParams(location.search);
var testId = params.get('test') || 'word';
var meta = TEST_META[testId] || TEST_META.word;
var r = SP.getResult(me.id, testId);

if(!me){
  /* requireAuth already redirected */
} else if(!r || !r.passed){
  document.getElementById('out').innerHTML = '<div class="alert alert-err">❌ Certificate sirf PASS hone par milta hai! Pehle test pass karo (60%+).</div><div class="center"><a class="btn btn-green" href="dashboard.html">Dashboard</a></div>';
} else {
  var certs = Object.values(JSON.parse(localStorage.getItem('sp_certs')||'{}'));
  var cert = certs.find(function(c){ return c.studentId===me.id && c.test===testId; });
  if(!cert){
    cert = {
      id: SP.makeCertId(),
      studentId: me.id,
      studentName: me.name,
      academy: me.academy || 'Roots Academy',
      course: meta.name,
      score: r.total,
      date: SP.today(),
      issuedAt: new Date().toISOString()
    };
    SP.saveCert(cert);
  }
  var verifyUrl = location.origin + location.pathname.replace(/student\/certificate\.html.*$/,'') + 'verify.html?id=' + cert.id;
  document.getElementById('out').innerHTML = SP.certHTML(cert, SP.getCertDesign(), SP.getAcademyProfile(), verifyUrl);
}
</script>
</body>
</html>
