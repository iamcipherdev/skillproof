<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — SkillProof</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <div class="brand"><span class="logo">S</span> SkillProof</div>
    <div class="navlinks"><span id="who"></span> <button class="btn btn-ghost btn-sm" onclick="SP.logout('../index.html')">Logout</button></div>
  </div>
</header>

<div class="wrap page">
  <h1 id="hello">Assalam-o-Alaikum! 👋</h1>
  <p class="lede">Apna test chuno. Har test mein MCQ + practical. 60% par PASS + certificate! 🎓</p>
  <div class="cards" id="cards"></div>
</div>

<footer class="site"><div class="wrap">SkillProof © 2026</div></footer>

<script src="../assets/js/common.js"></script>
<script src="../assets/js/questions.js"></script>
<script>
var me = SP.requireAuth('student','../index.html');
if(me){
  document.getElementById('hello').textContent = 'Assalam-o-Alaikum, ' + me.name + '! 👋';
  document.getElementById('who').textContent = me.name;
  var results = SP.getResults(me.id);
  var overall = SP.overall(me.id);
  var defs = [
    {id:'typing', meta:TEST_META.typing, start:'test-typing.html?lang=en'},
    {id:'word', meta:TEST_META.word, start:'test-mcq.html?subject=word'},
    {id:'excel', meta:TEST_META.excel, start:'test-mcq.html?subject=excel'},
    {id:'powerpoint', meta:TEST_META.powerpoint, start:'test-mcq.html?subject=powerpoint'},
    {id:'inpage', meta:TEST_META.inpage, start:'test-mcq.html?subject=inpage'}
  ];
  var html = '';
  defs.forEach(function(d){
    var r = results[d.id];
    var st, cls, extra='';
    if(r){ st = r.passed ? '✅ Completed' : '🔄 Completed'; cls = r.passed?'st-done':'st-prog'; extra = '<div class="score">'+r.total+'%</div>'; }
    else { st='⏳ Not started'; cls='st-todo'; }
    html += '<div class="tcard"><div class="icon">'+d.meta.icon+'</div><h3>'+d.meta.name+'</h3>'
      + '<div class="ur">'+d.meta.ur+'</div>'
      + '<span class="status '+cls+'">'+st+'</span>' + extra
      + '<a class="btn '+(r?'btn-ghost':'btn-blue')+' btn-block mt" href="'+d.start+'">'+(r?'Dobara do / Result':'Start Test')+'</a>'
      + (r ? '<a class="btn btn-ghost btn-block btn-sm" href="result.html?test='+d.id+'">Result dekho</a>' : '')
      + '</div>';
  });
  document.getElementById('cards').innerHTML = html;
}
</script>
</body>
</html>
