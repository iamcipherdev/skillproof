<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Login — SkillProof</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <div class="brand"><span class="logo">S</span> SkillProof</div>
    <div class="navlinks"><a href="index.html">← Home</a></div>
  </div>
</header>

<div class="login-page">
  <div class="login-box">
    <div class="lic">👨‍🏫</div>
    <h1>Teacher Login</h1>
    <div class="lsub">Students, results aur certificates dekho!</div>
    <div id="err"></div>
    <div class="field"><label>Email / Teacher ID</label><input id="tid" placeholder="e.g. admin" autocomplete="username"></div>
    <div class="field"><label>Password</label><input id="tpw" type="password" placeholder="••••••" autocomplete="current-password"></div>
    <button class="btn btn-blue btn-block btn-lg" onclick="go()">Login →</button>
    <div class="demo-hint">🧪 Demo: ID <b>admin</b> / Password <b>admin123</b></div>
    <a class="back" href="index.html">← Wapas home</a>
  </div>
</div>

<footer class="site"><div class="wrap">SkillProof © 2026</div></footer>

<script src="assets/js/common.js"></script>
<script>
function go(){
  document.getElementById('err').innerHTML = '';
  var t = SP.loginTeacher(document.getElementById('tid').value, document.getElementById('tpw').value);
  if(t) location.href = 'teacher/dashboard.html';
  else document.getElementById('err').innerHTML = '<div class="alert alert-err">❌ Ghalat ID ya password! Academy admin se apni ID lo.</div>';
}
document.getElementById('tpw').addEventListener('keydown', function(e){ if(e.key==='Enter') go(); });
document.getElementById('tid').focus();
</script>
</body>
</html>
