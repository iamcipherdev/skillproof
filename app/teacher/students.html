<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Students — SkillProof</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <div class="brand"><span class="logo">S</span> SkillProof <small style="font-size:13px;color:var(--muted)">Teacher</small></div>
    <div class="navlinks"><a href="dashboard.html">Dashboard</a> <button class="btn btn-ghost btn-sm" onclick="SP.logout('../index.html')">Logout</button></div>
  </div>
</header>

<div class="wrap page">
  <h1>Students 👥</h1>
  <p class="lede">Naya student add karo ya kisi ka result dekho!</p>

  <div class="login-card" style="max-width:560px;margin-bottom:28px">
    <h2>＋ Naya Student</h2>
    <div id="msg"></div>
    <div class="field"><label>Naam</label><input id="nm" placeholder="e.g. Ahmed Raza"></div>
    <div class="field"><label>Student ID</label><input id="sid2" placeholder="e.g. std001"></div>
    <div class="field"><label>Password</label><input id="spw2" placeholder="e.g. 1234"></div>
    <button class="btn btn-green btn-block" onclick="add()">Add Student</button>
  </div>

  <div style="overflow-x:auto"><table class="data" id="tbl"></table></div>
</div>

<footer class="site"><div class="wrap">SkillProof © 2026</div></footer>

<script src="../assets/js/common.js"></script>
<script src="../assets/js/questions.js"></script>
<script>
var me = SP.requireAuth('teacher','../index.html');
function render(){
  var students = SP.students();
  var results = JSON.parse(localStorage.getItem('sp_results')||'{}');
  var h='<tr><th>ID</th><th>Naam</th><th>Tests</th><th>Avg Score</th><th>Detail</th></tr>';
  students.forEach(function(s){
    var r = results[s.id]||{};
    var keys = Object.keys(r);
    var avg = keys.length? Math.round(keys.reduce(function(a,k){return a+(r[k].total||0);},0)/keys.length) : '—';
    h+='<tr><td><code>'+SP.esc(s.id)+'</code></td><td>'+SP.esc(s.name)+'</td><td>'+keys.length+'</td><td><b>'+avg+(avg==='—'?'':'%')+'</b></td>'
      +'<td><button class="btn btn-ghost btn-sm" onclick="detail(\''+SP.esc(s.id)+'\',\''+SP.esc(s.name).replace(/'/g,"\\'")+'\')">Dekho</button></td></tr>';
  });
  document.getElementById('tbl').innerHTML=h;
}
function detail(id, name){
  var r = SP.getResults(id);
  var keys = Object.keys(r);
  if(!keys.length){ alert(name+' ne abhi koi test nahi diya!'); return; }
  var msg = name+' ke results:\n\n';
  keys.forEach(function(k){
    var m = TEST_META[k]? TEST_META[k].name : k;
    msg += '• '+m+': '+r[k].total+'% '+(r[k].passed?'(PASS ✅)':'(FAIL ❌)')+'\n';
  });
  alert(msg);
}
function add(){
  var nm=document.getElementById('nm').value.trim(),
      id=document.getElementById('sid2').value.trim(),
      pw=document.getElementById('spw2').value.trim();
  var m=document.getElementById('msg');
  if(!nm||!id||!pw){ m.innerHTML='<div class="alert alert-err">Teeno khane bharo!</div>'; return; }
  var res=SP.addStudent(nm,id,pw);
  if(res.error){ m.innerHTML='<div class="alert alert-err">'+SP.esc(res.error)+'</div>'; }
  else { m.innerHTML='<div class="alert alert-ok">✅ Student add ho gaya!</div>'; document.getElementById('nm').value='';document.getElementById('sid2').value='';document.getElementById('spw2').value=''; render(); }
}
if(me) render();
</script>
</body>
</html>
